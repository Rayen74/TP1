name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build
        run: echo "Building the project..."

  test_job:
    runs-on: ubuntu-latest
    needs: build_job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test
        run: echo "Running tests..."

  deploy_job:
    runs-on: ubuntu-latest
    needs: test_job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy
        run: echo "Deploying the project..."